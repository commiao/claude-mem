[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-mem-eval"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = ["llm-eval>=0.1.1,<0.2"]

[project.entry-points."llm_eval.scenarios"]
"claude_mem.observation" = "claude_mem_eval:Observation"
"claude_mem.summary" = "claude_mem_eval:Summary"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_mem_eval = ["assets/*", "assets/modes/*"]
